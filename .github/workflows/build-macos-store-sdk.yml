name: Public Mac Store Qt SDK

on:
  workflow_dispatch:
    inputs:
      source_reference_sha256:
        description: 'App source hash reference only; no app archive is loaded or built'
        required: true
        default: '96e0194cd599f8508c2e6f4d93a801079434b95e41d93ef1d6339c82342fbd0c'
        type: string

permissions:
  contents: read

jobs:
  qt-sdk:
    if: github.event.repository.visibility == 'public'
    runs-on: macos-15
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Check standalone SDK input and failure contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sdk-logs
          python -m unittest discover -s native-candidate/qt-store-sdk -p 'test_*.py' -v \
            2>&1 | tee sdk-logs/harness-tests.log
      - name: Build and relocate the four-module Vulkan-capable Store SDK
        timeout-minutes: 110
        shell: bash
        env:
          APP_SOURCE_REFERENCE: ${{ inputs.source_reference_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p sdk-logs
          python native-candidate/qt-store-sdk/build_sdk.py \
            --work "$RUNNER_TEMP/gameremote-qt-sdk" \
            --output "$GITHUB_WORKSPACE/sdk-output" \
            --app-source-reference-sha256 "$APP_SOURCE_REFERENCE" \
            2>&1 | tee sdk-logs/build.log
      - name: Retain SDK, complete upstream sources, notices and build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-store-qt-sdk-${{ github.run_id }}
          path: |
            sdk-output/
            sdk-logs/
          if-no-files-found: warn
          retention-days: 1
